# Config inicial SOLO HTTP — usar antes de Certbot.
# Instalar: sudo cp .../zomidev.initial.conf /etc/nginx/sites-available/zomidev
# Puerto local en el VPS (debe coincidir con ZOMIDEV_FRONTEND_PORT en docker/.env).
#
# Después de certbot --nginx, opcionalmente sustituye por zomidev.conf
# (ya tendrás /etc/letsencrypt/options-ssl-nginx.conf y los certificados).

server {
    listen 80;
    listen [::]:80;
    server_name zomidev.com www.zomidev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
