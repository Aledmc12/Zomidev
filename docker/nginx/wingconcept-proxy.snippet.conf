# ─────────────────────────────────────────────────────────────────────────────
# Pegar en /opt/wingconcept/docker/nginx/nginx.conf (dentro de http { ... })
# JUSTO ANTES del cierre de http { — no toques los bloques de wingconcept.com
#
# WingConcept termina SSL (80/443). Estos bloques reenvían:
#   zomidev.com           → 172.17.0.1:8080 (ZomiDev)
#   app.carreraarango.com → 172.17.0.1:8081 (CarreraApp)
# ─────────────────────────────────────────────────────────────────────────────

    # ── ZomiDev HTTP (proxy → nginx ZomiDev en 8080) ─────────────────────────
    server {
        listen 80;
        server_name zomidev.com www.zomidev.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://172.17.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }

