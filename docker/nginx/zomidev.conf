# /etc/nginx/sites-available/zomidev
# Instalar: sudo ln -s /etc/nginx/sites-available/zomidev /etc/nginx/sites-enabled/
#
# Reemplaza ZOMIDEV_PORT por el puerto definido en docker/.env (default 3000).
# NO elimina tu sitio existente — es un server block adicional por dominio.

# Redirige HTTP → HTTPS (Cloudflare también puede hacerlo)
server {
    listen 80;
    listen [::]:80;
    server_name zomidev.com www.zomidev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zomidev.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zomidev.com;

    ssl_certificate     /etc/letsencrypt/live/zomidev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zomidev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zomidev.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zomidev.com;

    ssl_certificate     /etc/letsencrypt/live/zomidev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zomidev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # TLS moderno
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30M;

    # Headers de seguridad (Cloudflare puede duplicar algunos — no es problema)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Bloquear acceso directo al backend (solo frontend en Docker)
    location / {
        proxy_pass http://127.0.0.1:ZOMIDEV_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP real del visitante cuando usas Cloudflare
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Denegar rutas sensibles desde bots/scanners
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
