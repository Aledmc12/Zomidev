# ZomiDev — Produccion (VPS)
# PostgreSQL: Supabase (externo). Redis + app en red interna Docker.
#
# Uso:
#   cd docker
#   cp .env.example .env          # editar REDIS_PASSWORD
#   cp ../backend/.env.production.example ../backend/.env.production
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# IMPORTANTE: `name: zomidev` evita colisionar con WingConcept (ambos usan carpeta docker/).

name: zomidev

services:
  redis:
    image: redis:7-alpine
    container_name: zomidev_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - zomidev_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zomidev_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - zomidev_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zomidev_internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://zomidev.com}
        NEXT_PUBLIC_SITE_NAME: ZomiDev
    container_name: zomidev_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8000
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - zomidev_internal

  nginx:
    image: nginx:alpine
    container_name: zomidev_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/zomidev-standalone.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Publicar en docker0 (172.17.0.1) para que wingconcept_nginx pueda hacer proxy.
      # 127.0.0.1 solo funciona desde el host, NO desde otros contenedores Docker.
      - "${ZOMIDEV_NGINX_BIND:-172.17.0.1}:${ZOMIDEV_NGINX_PORT:-8080}:8080"
    depends_on:
      - frontend
    networks:
      - zomidev_internal

volumes:
  redis_data:
  zomidev_uploads:

networks:
  zomidev_internal:
    driver: bridge
